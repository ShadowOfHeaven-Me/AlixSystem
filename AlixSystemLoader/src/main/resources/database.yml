#------------------------------------------------#
#                   MIGRATION                    #
#------------------------------------------------#

#This section is used for migration from other plugins

#The table name of this database (For instance, "alix")
migrate-table-name: authme
# The user/database name
migrate-user: authme
#The user of this database (For instance, "root")
migrate-username: authme
#Connection parameters
migrate-password:
migrate-host:
migrate-port:
# Path to the SQLite file, assuming the starting position in the "plugins" folder
migrate-sqlite-path: "AuthMe/authme.db"

#The maximum lifetime of a database connection (in seconds)
migrate-max-lifetime: 60

#------------------------------------------------#
#                 EXTERNAL SYNC                  #
#------------------------------------------------#

#Defines whether alix should store its data into some database, the connection parameters of which are defined below
# A copy of the data will still be kept locally
external-sync: false
# Defines how the caching strategy used in order to database requests
# preload - Requests all data, once, at start-up (best option if you don't expect changes to the db from other sources)
# on_connection_if_exists - A database request will be sent each time an already existing user connects to the server (useful in case of external changes,
#  that apply to already existing players)
# on_connection - A database request will be sent each time each time a user connects to the server (useful in case of external changes,
#  including account creation - Beware: This allows for a possible abuse of overloading database queries in case of attacks.
#  I'll try to stop this in the future, but know that for now this opens up a vulnerability)
caching-strategy: preload
# Defines whether a player's 2FA token cache should also be re-fetched from the database on every login,
# in case it was changed by an external source sharing the same database (e.g. a linked website's own 2FA
# setup) - independent of caching-strategy above, which only governs account data, not the token
# specifically. Only relevant if external-sync is enabled; adds one extra database request per login.
refresh-token-on-login: false
#Defines the database connector type to use. Available:
# MySQL - supports some MySQL-like databases (for example MariaDB)
# PostgreSQL - uses Postgres
# SQLite - stores data in a locally-defined file, SQL-style
database-type: PostgreSQL
# The user/database name
user: postgres

#The user of this database (for instance, "root")
username:
#Connection parameters
password:
host:
port:
# Path to the SQLite file, assuming the starting position in the "plugins" folder
sqlite-path: "AlixSystem/sqlite.db"

#The maximum lifetime of a database connection (in seconds)
max-lifetime: 1800