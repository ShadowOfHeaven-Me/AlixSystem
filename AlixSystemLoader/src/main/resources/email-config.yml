#Sets up an SMTP connection so players can add their own email, used for account recovery or linking to
#your own website. See https://github.com/ShadowOfHeaven-Me/AlixSystem/wiki/Account-Recovery-Email-Set%E2%80%90Up

#------------------------------------------------#
#                 SERVER SET-UP                  #
#------------------------------------------------#

username: account@gmail.com
sender: Alix
email: account@gmail.com

# Connection parameters
password:
host: smtp.gmail.com
# Usually 587 (TLS) or 465 (SSL); a custom port also gets SSL enabled
port: 587
#
# REQUIRED ONE-TIME STEP: also verify the 'email' address above in-game, as an admin:
#   /as sendverifyemail   (sends a code to it)
#   /as verifyemail <code>
# Until done, every email-dependent player feature stays unavailable, even for players who already saved one.

#------------------------------------------------#
#                USER EXPERIENCE                 #
#------------------------------------------------#

# Attempts allowed for entering the account email during recovery, before being kicked
max-email-attempts: 5
# Attempts allowed for entering the recovery code, before being kicked
max-code-attempts: 3
# Minutes a sent verification code stays valid for
verify-code-expiry-minutes: 60

#------------------------------------------------#
#            VERIFICATION EMAIL HTML             #
#------------------------------------------------#

# File name of a custom HTML template for the verification email, in this plugin's "email-templates" folder
# (created automatically). Leave empty for the built-in plain-text template. Placeholders: {code}, {command},
# {verification_link} (empty if web verification is disabled below). Embed an image via
# "email-templates/images" and reference it as <img src="cid:yourimage.png">, or just link one remotely.
custom-verify-email-template: ""

#------------------------------------------------#
#             WEB VERIFICATION LINK              #
#------------------------------------------------#

# Whether verification emails also include a one-click web link, instead of only an in-game code. Runs a
# small built-in webserver that must be reachable from the internet - leave disabled if unsure what that
# means; /account verifyemail <code> always works regardless.
enable-web-verification: false
# The local address/port the built-in webserver binds to
web-verification-bind-address: "0.0.0.0"
web-verification-port: 8091
# The externally-reachable base URL players' browsers hit, e.g. "https://verify.your-domain.com" behind a
# reverse proxy, or "http://your.server.ip:8091" exposed directly. Must be set correctly for the links to work.
web-verification-public-url: ""
# Minutes a verification link stays valid for (also single-use)
web-verification-token-expiry-minutes: 30
#
# To check this is reachable without a real email: with enable-web-verification: true, open
# "<web-verification-public-url>/verify" in a browser. An "Link invalid or expired" page IS the correct
# result (no real token was used) - what matters is getting a page at all, not a connection failure.
#
# The web verification page's title/message text lives in messages.properties/messages.txt (the
# "web-verification.*" keys), same as every other player-facing string.
