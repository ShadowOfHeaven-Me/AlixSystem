admin-commands-bypasslimit: "  &c/as bl/bypasslimit <jméno> &7- Přidá dané jméno na seznam výjimek z limitu účtů. Takové účty nejsou omezovány limiterem účtů bez ohledu na parametr 'max-total-accounts' v configu."
admin-commands-bypasslimit-remove: "  &c/as bl-r/bypasslimit-remove <jméno> &7- Odebere dané jméno ze seznamu výjimek z limitu účtů."
admin-commands-changepassword: "  &c/as cp/changepassword <hráč> <nové heslo> [typ přihlášení] &7- Nastaví hráči nové heslo, a volitelně změní i typ přihlášení."
admin-commands-commands: "  &c/as commands &7- Vypíše všechny dostupné příkazy, admin i pro hráče."
admin-commands-forcestatus: "  &c/as fs/forcestatus <hráč> <status> &7- Vynutí nastavení premiového statusu hráče (pokud to lze bezpečně udělat)"
admin-commands-fullyremovedata: "  &c/as frd/fullyremovedata <hráč> &7- Kompletně odstraní všechna data účtu daného hráče. Data poté nelze obnovit."
admin-commands-panicmode: "  &c/as panicmode [on/off] &7- Ručně zapne/vypne Panic-Mode (připojit se mohou pouze již registrované IP adresy)."
admin-commands-reload: "  &c/as reload &7- Znovu načte config.yml/database.yml/gui-menus/langs/allow-list z disku bez restartu proxy. Nastavení emailu a aliasy příkazů stále vyžadují opravdový restart."
admin-commands-resetpassword: "  &c/as rp/resetpassword <hráč> &7- Resetuje heslo hráče."
admin-commands-resetpassword-type: "  &c/as rp/resetpassword <hráč> [typ přihlášení] &7- Resetuje heslo hráče a změní jeho typ přihlášení. Dostupné typy: COMMAND, PIN & ANVIL."
admin-commands-resetstatus: "  &c/as rs/resetstatus <hráč> &7- Resetuje premiový status hráče. Určeno hlavně k odpuštění crackovaným hráčům, kteří použili /premium"
admin-commands-save-all-local-to-db: "  &c/as save_all_local_to_db &7- Uloží všechna lokálně uložená data do externě definované databáze (pokud existuje)."
admin-commands-sendverifyemail: "  &c/as sendverifyemail &7- Pošle ověřovací kód na vlastní odchozí adresu serveru (viz email-config.yml). Nutné provést jednou, než začne fungovat jakákoliv na emailu závislá funkce (např. obnova účtu)."
admin-commands-ufw: "  &c/as ufw <ip> &7- Pokud možno odebere danou ip z Firewall databáze."
admin-commands-user: "  &c/as user <hráč> &7- Vrátí informace o daném hráči."
admin-commands-verifyemail: "  &c/as verifyemail <kód> &7- Potvrdí kód z /as sendverifyemail výše."
