#------------------------------------------------------------------------------------#
#                 This is the config.yml file for AlixVelocity.                      #
#                   A partially finished documentation can be                        $
#          found at https://github.com/ShadowOfHeaven-Me/AlixSystem/wiki             #
#         Support will be provided at https://discord.com/invite/bWjmA7s3xV          #
#------------------------------------------------------------------------------------#


#-----------------------------------------------#
#                  PRE-REGISTER                 #
#-----------------------------------------------#

#Config used when an unregistered player has not joined the server yet, but is trying to

#Prevent the very first connection for unregistered users, if Alix determines the traffic to be high
prevent-first-time-join-during-high-traffic: true
#Used for the parameter above to help determine the maximum size of the connecting users list
connection-list-size: 500
#Defines how long (in seconds) should a connection be stored for until it is forgotten (Used for 'prevent-first-time-join')
forget-connection-in: 60
#Defines how much accounts in total should be a player allowed to have (counted by their ip), set it to 0 or less if you want to disable it (usually works as an antibot safety measure when the botter uses a single IP to send the bots)
max-total-accounts: 1
#Prevents unregistered players from logging in using a VPN (designed with the main purpose of preventing players bypassing the limit of 'max-total-accounts' by using VPNs, but may also work a bot counter-measurement)
anti-vpn: true
#Defines whether bedrock players should also be disallowed from registering when using a VPN
anti-vpn-include-bedrock: true
#Defines whether bot attack detection algorithms should be enabled in pair with a fast-blocking FireWall system. Works best with 'prevent-first-time-join-during-high-traffic' and 'anti-vpn' set to true, and 'max-total-accounts' at 1.
antibot-service: true
#Defines whether Alix should load its built-in "bad ips" file into the fast-blocking Firewall system. Setting this to false can save a bit of RAM
load-builtin-ips: true
#Defines whether Alix should perform name validation checks: (1-16 chars in length, 0-9/a-z/A-Z/_ characters allowed)
validate-name: true
#Defines whether a player of an already existing player's nickname, ignoring casing, should be allowed to join pre-register
# true -> Allow e.g. 'Marcos' & 'marcos' to coexist
# false -> Disallow
allow-case-sensitive-nicknames: false


#----------------------------------------------#
#                    LOGIN                     #
#----------------------------------------------#


#Config used for matters related to logging in/registering

#Defines the default way the users have to register/log in. Available:
# command - The user registers/logs in using the traditional password typed in the verification command
# anvil - The user registers/logs in using an anvil rename gui
# pin - The user registers/logs in using a pin gui
password-type: command
#Defines whether a new/changed password is checked against the HaveIBeenPwned breached-password database
#(https://haveibeenpwned.com/API/v3#PwnedPasswords) before being accepted, rejecting it if it's already
#known to be publicly breached. Uses their "k-anonymity" range API: only the first 5 characters of the
#password's SHA-1 hash are ever sent over the network - the real password, and even its full hash, never
#leave this server. Off by default, since it adds a network round-trip (bounded to ~2 seconds, and it
#fails open - a slow/unreachable API never blocks registration, it just skips the check for that attempt)
#to every registration and password change while enabled. Not checked for PIN-type logins (a bare 4-digit
#PIN has no meaningful breach data to check against).
check-breached-passwords: false
#The port AlixSystem's device-fingerprinting ("Device PassKey") service listens on. 0 disables the feature
#entirely - no "Create a Device PassKey" option is shown in /account's login settings, and no passkey
#recovery option is offered during login - since there's no port to talk to a client on.
fingerprinting-port: 0
#Defines whether premium players should be given their equivalent mojang-assigned uuid (their data will persist between name changes)
#Possible values:
# true -> always assign a premium uuid to premium players (good if you don't already have premium players with an offline uuid)
# false -> never assign premium uuid
premium-uuid: false
#Defines how long (in seconds) should be a player allowed to be on the server not logged in
max-login-time: 75
#Defines how many attempts does a user have when entering his password (setting it too high could be risky because of password crackers)
max-login-attempts: 4
#Defines whether all players (premium included) should be required to set up a password (instead of being automatically registered)
require-register-from-all: false
#Defines whether the registering user should have to repeat the password he's trying to set whilst registering
#Parameter 'true' would result in the format /register <password> <password>
#Parameter 'false' would result in the format /register <password>
require-password-repeat-in-register: false
#Defines whether the registering user should have to additionally provide an email address whilst registering (only applies to 'password-type: command')
#Parameter 'true' would result in the format /register <password> <email> (or /register <password> <password> <email> if the repeat option above is also enabled)
#Parameter 'false' would result in the regular /register <password> format
#Note: this actually gates registration on verifying that email - a code is sent immediately, and the account is only
#created once the player types "/verifyemail <code>" back. If they never do, no account is created at all, so
#alix_users2.email never ends up holding an address nobody has actually proven ownership of.
require-email-in-register: false
#Defines how long (in seconds) a player is allowed to wait for their registration verification email to
#arrive and type "/verifyemail <code>", once it's been sent - separate from 'max-login-time' above, since
#receiving an email can easily take longer than that. Only applies while 'require-email-in-register' is true.
#Set to 0 to disable this timeout entirely (the player can then wait as long as they need to for the email).
email-verification-time: 300
#Defines whether registering users must first accept a set of Terms & Conditions (e.g. for GDPR / personal data collection compliance) before they're allowed to register.
#Applies to EVERY login/registration type (command, PIN, Anvil GUI, and Bedrock/Geyser-Floodgate) - not just command-based registration.
#When enabled, players will be shown the link configured below and asked to type '/terms accept' or '/terms decline'. Declining results in a kick.
require-terms-acceptance: false
#The URL of your Terms & Conditions / privacy policy page, shown to players when 'require-terms-acceptance' is enabled above
terms-url: "https://example.com/terms"
#Defines whether all characters (so including non-english chars) should be shown as valid during verification command typing, either during login or register.
#If set to false, only english characters will be seen as valid by the verifying user. Any other character range will be shown in red as invalid. However, when
# password repeat in /register is enabled, the second password argument will differ in color, making it more distinguishable.
# Set it to false if you only expect english users
command-support-all-characters: true
#Defines whether, if the joining player has the nickname of a premium account, it should be required of him to also be the owner of that account - forbid server
# join if account ownership is not proven (unless 'assume-non-premium-if-auth-failed' is true). If successfully proven, the user will from now on be automatically logged in/registered if premium
# Possible values:
# never - Allows cracked players to join with premium nicknames
# unregistered_and_suggested -
#    Unregistered players with premium nicknames, who suggest they are premium by various means (1.19+ clients),
#    will be requested to authenticate their account ownership. Remember that this also means that cracked players with premium nicknames will also be able to register,
#    which in return might disallow the owners of those premium accounts from ever joining your server.
# unregistered - Unregistered players with premium nicknames will always be requested to authenticate their account ownership
#  (unregistered cracked players can't ever join with the nickname of a premium player)
# always - Premium nicknames will always be requested to perform premium authentication (WARNING: This technically allows any premium player to steal a cracked user's account by simply changing their name to match theirs)
require-ownership-of-premium-nickname: unregistered_and_suggested
#Defines whether clients using a version before 1.19, and a premium nickname, should be assumed to be premium
# When true:
# Premium pre-1.19 clients will be automatically logged in/registered, but cracked clients within that version range
# might not be able to join with nicknames of premium players (if the client does not disconnect by itself, the premium status will be assumed by the 'assume-non-premium-if-auth-failed' parameter)
# When false:
# Premium pre-1.19 clients will need to manually log in/register, but cracked clients within that version range will be
# able to join with nicknames of premium players without the risk of disconnecting
require-premium-when-no-suggestion: true
#Defines whether, if the joining user is unregistered and joining with a nickname of a premium player,
# and the client does not disconnect by itself, but fails at authorization, he should be assumed to be a non-premium
# player of that nickname (will disallow the actual owner of the premium account from joining)
assume-non-premium-if-auth-failed: true
#Defines whether a user should be shown the "Login automatically?" gui, with the ability to configure their ip autologin preference, right after registering
ip-autologin-ask: true
#Defines whether the ip autologin should be forcefully disabled. This option has a higher priority than the user's /account settings
forcefully-disable-auto-login: false
#Defines whether the players who joined with the same ip as before should be automatically logged in (this may cause problems for VPN users if you allow vpn connections). This value is used as the default if the given user does not specify it himself.
auto-login: true
#Defines the way the passwords set by the users will be hashed in by default
# 0 - No hash, not recommended in case of password leaks
# 1 - Mixes characters' code points, very fast but possibly repeatable, stored in a 32-bit integer
# 2 - Uses uuid's bit generation & MD5 hashing, not recommended due to MD5 deprecation, stored in a 64-bit integer
# 3 - Uses uuid's bit generation & SHA-256 hashing, stored in a 64-bit integer
# 4 - Uses SHA-256, always saved into a 64 character-long hex
# 5 - Uses SHA-512, always saved into a 64 character-long hex
# 6 - Uses BCrypt, Version 2A
password-hash-type: 4
#Defines whether a non-premium, server-client connection should be encrypted - helps mitigate MITM attacks, but slightly increases CPU usage
# always - All client connections will always be requested to encrypt their connection (some pre-1.20.5 cracked clients might disconnect because of this)
# safe - Only 1.20.5+ client connections will be encrypted (no risk of disconnecting)
# never - Will never try to enable encryption (Besides side effects of checking the client's premium status)
encrypt-connection: safe
#Defines the commands invoked after a successful, manual register. Specified in the form of a list. Replaces all %name% with the player's name. If "-p" is placed at the end of a command it will be invoked with the player as the sender.
#Invoked after a manual register
#An example would be
#- say 3333 %name% -p"
after-register-commands:
#Works exactly the same as the parameter above with the sole difference of being invoked after a successful, manual login
after-login-commands:
#Works exactly like the parameters above but invoked on an automatic register (premium register)
after-auto-register-commands:
#Works exactly like the parameters above but invoked on an automatic login (premium login or ip auto-login!)
after-auto-login-commands:
#Works exactly like the parameters above but invoked on a premium register/login
after-any-premium-join-commands:


#------------------------------------------------#
#                    LANGUAGE                    #
#------------------------------------------------#

#Config used to select the language of the messages sent to players
#Defines which messages file to load. "en" (the default) loads "messages.properties" - a normal,
#freely-customizable file that (like this one) keeps your edits across plugin updates. Any other value
#loads the matching bundled, ready-made translation from "langs/<code>.properties" instead (e.g. "cs" ->
#langs/cs.properties) - these are NOT customizable: every plugin update fully overwrites them with the
#newest bundled translation, discarding direct edits. If you want to customize player-facing text, keep
#"language: en" and edit messages.properties instead.
#Available: en (English), cs (Czech/Čeština)
language: en


#------------------------------------------------#
#                    GENERAL                     #
#------------------------------------------------#

#Config used for the overall set-up

#Prefix of the messages sent by Alix
prefix: "&c[Alix] > &7"
#Defines whether the prefix should be appended
append-prefix: true


#------------------------------------------------#
#                   TECHNICAL                    #
#------------------------------------------------#

#Config used for the very technical features of Alix

#Define these explicitly if you ever encounter issues with server re-transfer
#The domain/ip used to typically connect to your server
transfer-hostname: ""
#The port Velocity or some other most front proxy uses
transfer-port:
#Defines whether debug messages should be sent (usually helps the developer in identifying the source of an error)
debug: false
#Whether the motd should be cached (and ping responses prepended & sent early), in order to optimize ping requests (currently expires after 6 seconds)
optimize-pings: true
#Whether user emails should be saved in an encrypted form. You can set this to false in case you need it in raw text
encrypt-emails: true
#Whether to support hosting any kind of HTTP service (e.g. a resource pack server) on the same port as the minecraft server
support-mc-port-http: false