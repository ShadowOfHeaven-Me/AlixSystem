#--------------------------------------------------------------------------------------------#
#  This is the DEFAULT ("language: en") messages file - it's yours to customize freely, and,   #
#  like config.yml, is merge-updated across plugin updates: any message you edit here is kept,  #
#  and only genuinely new/removed keys are added/removed on update.                             #
#                                                                                                #
#  A "langs/<code>.properties" file (e.g. langs/cs.properties) exists for every OTHER bundled   #
#  translation. Those are treated as ready-made, plugin-owned translations, NOT as customizable  #
#  config: every plugin update fully OVERWRITES the langs/ file for whatever language you have   #
#  selected, discarding any edits you made to it directly. If you want to customize player-      #
#  facing text, either use "language: en" and edit THIS file, or edit this file and keep         #
#  "language: en" - never edit a langs/*.properties file expecting your changes to survive an    #
#  update.                                                                                        #
#--------------------------------------------------------------------------------------------#
