admin-commands-bypasslimit: "  &c/as bl/bypasslimit <name> &7- Adds the specified name to the account limit bypass list. Such accounts are not restricted by the account limiter, no matter the config 'max-total-accounts' parameter."
admin-commands-bypasslimit-remove: "  &c/as bl-r/bypasslimit-remove <name> &7- Removes the specified name from the account limit bypass list."
admin-commands-changepassword: "  &c/as cp/changepassword <player> <new password> [login type] &7- Sets the player's password to the new one specified, and optionally changes their login type."
admin-commands-commands: "  &c/as commands &7- Lists all available commands, admin and player-facing alike."
admin-commands-forcestatus: "  &c/as fs/forcestatus <player> <status> &7- Forcefully sets the player's premium status (if can safely be done)"
admin-commands-fullyremovedata: "  &c/as frd/fullyremovedata <player> &7- Fully removes all account data of the specified player. The data cannot be restored after this operation."
admin-commands-panicmode: "  &c/as panicmode [on/off] &7- Manually enables/disables Panic-Mode (only already-registered IPs can connect)."
admin-commands-reload: "  &c/as reload &7- Reloads config.yml/database.yml/gui-menus/langs/allow-list from disk without restarting the proxy. Email settings and command aliases still need a real restart."
admin-commands-resetpassword: "  &c/as rp/resetpassword <player> &7- Resets the player's password."
admin-commands-resetpassword-type: "  &c/as rp/resetpassword <player> [login type] &7- Resets the player's password and changes their login type. Available login types: COMMAND, PIN & ANVIL."
admin-commands-resetstatus: "  &c/as rs/resetstatus <player> &7- Resets the player's premium status. Mainly aimed to forgive cracked players who used /premium"
admin-commands-save-all-local-to-db: "  &c/as save_all_local_to_db &7- Saves all locally-stored data into an externally-defined database (if any)."
admin-commands-sendverifyemail: "  &c/as sendverifyemail &7- Sends a verification code to the server's own outgoing address (see email-config.yml). Required once, before any email-dependent player feature (e.g. account recovery) becomes available."
admin-commands-ufw: "  &c/as ufw <ip> &7- Removes the given ip from the Firewall Database, if possible."
admin-commands-user: "  &c/as user <player> &7- Returns information about the given player."
admin-commands-verifyemail: "  &c/as verifyemail <code> &7- Confirms the code from /as sendverifyemail above."
